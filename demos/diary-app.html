<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光日记 · 可交互日记软件</title>
<style>
  :root {
    --bg: oklch(98% 0.004 240);
    --surface: oklch(100% 0 0);
    --surface-2: oklch(96.4% 0.005 240);
    --fg: oklch(23.5% 0 0);
    --muted: oklch(50% 0.018 240);
    --faint: oklch(54% 0.014 240);
    --border: oklch(90% 0.006 240);
    --border-strong: oklch(85% 0.008 240);

    --accent: oklch(62.6% 0.164 250);
    --accent-strong: oklch(50% 0.16 250);
    --accent-soft: oklch(94% 0.03 250);
    --accent-soft-hover: oklch(92% 0.03 250);
    --accent-tint: oklch(86% 0.076 242);
    --accent-solid: oklch(50% 0.16 250);
    --accent-solid-hover: oklch(44% 0.16 250);
    --on-accent: #ffffff;

    --danger: oklch(58% 0.18 25);
    --danger-soft: oklch(95% 0.02 25);
    --success: oklch(50% 0.13 155);
    --success-soft: oklch(95% 0.03 155);

    --shadow-sm: 0 1px 2px oklch(20% 0.02 240 / 0.05);
    --shadow-md: 0 8px 28px oklch(20% 0.02 240 / 0.08);
    --shadow-lg: 0 20px 50px oklch(20% 0.02 240 / 0.16);

    --radius: 14px;
    --radius-sm: 10px;
    --radius-lg: 20px;
    --sidebar-w: 232px;
    --font-display: 'Söhne', 'Avenir Next', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }

  [data-theme="dark"] {
    --bg: oklch(17% 0.012 240);
    --surface: oklch(21% 0.014 240);
    --surface-2: oklch(24% 0.016 240);
    --fg: oklch(95% 0.004 240);
    --muted: oklch(71% 0.015 240);
    --faint: oklch(60% 0.014 240);
    --border: oklch(31% 0.014 240);
    --border-strong: oklch(38% 0.016 240);
    --accent: oklch(62.6% 0.164 250);
    --accent-strong: oklch(74% 0.13 250);
    --accent-soft: oklch(31% 0.06 250);
    --accent-soft-hover: oklch(33% 0.06 250);
    --accent-tint: oklch(37% 0.09 250);
    --accent-solid: oklch(54% 0.16 250);
    --accent-solid-hover: oklch(48% 0.16 250);
    --on-accent: #ffffff;
    --danger: oklch(58% 0.17 25);
    --danger-soft: oklch(29% 0.05 25);
    --success: oklch(52% 0.13 155);
    --success-soft: oklch(28% 0.05 155);
    --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.3);
    --shadow-md: 0 10px 30px oklch(0% 0 0 / 0.35);
    --shadow-lg: 0 22px 55px oklch(0% 0 0 / 0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 22px 16px 16px;
    gap: 6px;
  }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: var(--radius-sm);
    border: none; background: transparent; cursor: pointer;
    color: var(--muted); font-family: inherit; font-size: 15px;
    text-align: left; width: 100%;
    transition: background .15s ease, color .15s ease;
    position: relative;
  }
  .nav-item svg { width: 19px; height: 19px; flex-shrink: 0; }
  .nav-item:hover { background: var(--surface-2); color: var(--fg); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
  .nav-item.active::before {
    content: ""; position: absolute; left: -16px; top: 8px; bottom: 8px;
    width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
  }
  .nav-badge {
    margin-left: auto; font-size: 12px; font-weight: 600;
    background: var(--accent-soft); color: var(--accent-strong);
    padding: 1px 8px; border-radius: 999px;
  }
  .sidebar-spacer { flex: 1; }
  .sidebar-foot { padding: 12px 8px 4px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
  .user {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; color: var(--fg);
  }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-strong);
    display: grid; place-items: center; font-weight: 700; font-size: 14px;
  }
  .user-meta { line-height: 1.3; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; padding: 34px 40px 60px; max-width: 1240px; margin: 0 auto; }
  .view { display: none; animation: fade .22s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
  .page-title { font-family: var(--font-display); font-size: 26px; font-weight: 750; letter-spacing: -0.02em; margin: 0; line-height: 1.2; }
  .page-sub { color: var(--muted); margin: 6px 0 0; font-size: 14.5px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid transparent; border-radius: 11px;
    padding: 10px 16px; font-family: inherit; font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: all .15s ease; line-height: 1; white-space: nowrap;
  }
  .btn svg { width: 17px; height: 17px; }
  .btn-primary { background: var(--accent-solid); color: var(--on-accent); box-shadow: var(--shadow-sm); }
  .btn-primary:hover { background: var(--accent-solid-hover); transform: translateY(-1px); }
  .btn-danger { background: var(--danger); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-danger:hover { background: oklch(50% 0.17 25); transform: translateY(-1px); }
  .btn-ghost { background: var(--surface); color: var(--fg); border-color: var(--border-strong); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-soft { background: var(--accent-soft); color: var(--accent-strong); }
  .btn-soft:hover { background: var(--accent-soft-hover); }
  .btn-danger-ghost { background: transparent; color: var(--danger); border-color: transparent; }
  .btn-danger-ghost:hover { background: var(--danger-soft); }
  .btn-sm { padding: 8px 12px; font-size: 13.5px; border-radius: 9px; }
  .btn-icon { padding: 9px; border-radius: 10px; }

  /* ---------- Cards / generic ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .tag-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12.5px; font-weight: 500; color: var(--accent-strong);
    background: var(--accent-soft); border: 1px solid transparent;
    padding: 3px 10px; border-radius: 999px; cursor: pointer;
    transition: background .15s ease;
  }
  .tag-pill:hover { background: var(--accent-soft-hover); }
  .faint { color: var(--faint); }

  /* ---------- Home ---------- */
  .hero-calendar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
  }
  .cal-main { padding: 22px 24px 20px; min-width: 0; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .cal-month-toggle {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 8px 14px;
    font-family: var(--font-display); font-size: 17px; font-weight: 750;
    letter-spacing: -0.01em; color: var(--fg); cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .cal-month-toggle:hover { background: var(--surface-2); }
  .cal-month-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cal-month-toggle svg { width: 16px; height: 16px; color: var(--faint); transition: transform .15s ease; }
  .cal-month-toggle.open svg { transform: rotate(180deg); }
  .cal-picker { padding: 4px 0 6px; }
  .cal-picker-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .cal-picker-title {
    flex: 1; text-align: center; font-family: var(--font-display);
    font-size: 16px; font-weight: 750; letter-spacing: -0.01em;
    background: transparent; border: none; color: var(--fg); cursor: pointer;
    padding: 6px 10px; border-radius: 9px; transition: background .15s ease;
  }
  .cal-picker-title:hover { background: var(--surface-2); }
  .cal-picker-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cal-picker-title svg { width: 14px; height: 14px; color: var(--faint); vertical-align: -2px; }
  .cal-picker-nav {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px; flex: 0 0 auto;
    border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--fg); cursor: pointer; transition: background .15s ease, border-color .15s ease;
  }
  .cal-picker-nav:hover { background: var(--surface-2); }
  .cal-picker-nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cal-picker-nav svg { width: 16px; height: 16px; }
  .cal-picker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cal-picker-cell {
    height: 44px; border: 1px solid transparent; border-radius: 10px;
    background: transparent; font-family: inherit; font-size: 14px; font-weight: 500;
    color: var(--fg); cursor: pointer; transition: background .13s ease, border-color .13s ease, color .13s ease;
  }
  .cal-picker-cell:hover { background: var(--surface-2); }
  .cal-picker-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cal-picker-cell.selected { background: var(--accent-solid); color: var(--on-accent); font-weight: 650; }
  .cal-picker-cell.selected:hover { background: var(--accent-solid); }
  .cal-nav { display: flex; align-items: center; gap: 6px; }
  .cal-nav-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--fg); cursor: pointer; transition: background .15s ease, border-color .15s ease;
  }
  .cal-nav-btn:hover { background: var(--surface-2); }
  .cal-nav-btn svg { width: 16px; height: 16px; }
  .cal-today-btn {
    border: none; background: transparent; color: var(--accent-strong);
    font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    padding: 8px 10px; border-radius: 9px; transition: background .15s ease;
  }
  .cal-today-btn:hover { background: var(--accent-soft); }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .cal-weekdays span { text-align: center; font-size: 12.5px; font-weight: 600; color: var(--faint); padding: 4px 0; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-day {
    position: relative; display: flex; align-items: center; justify-content: center;
    height: 40px; border: none; padding: 0; background: transparent; border-radius: 10px;
    font-family: inherit; font-size: 13.5px; color: var(--fg); cursor: pointer;
    transition: background .13s ease, color .13s ease;
  }
  .cal-day:hover { background: var(--surface-2); }
  .cal-day.other { color: var(--faint); }
  .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .cal-day.selected { background: var(--accent-solid); color: var(--on-accent); }
  .cal-day.selected.today { box-shadow: inset 0 0 0 2px oklch(100% 0 0 / 0.55); }
  .cal-day.selected:hover { background: var(--accent-solid); }
  .cal-day-num { line-height: 1; }
  .cal-dot {
    position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }
  .cal-day.selected .cal-dot { background: var(--on-accent); }
  .day-entries { margin-top: 24px; }
  .day-entries-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 14px;
  }
  .day-entries-title {
    margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 750;
    letter-spacing: -0.01em;
  }
  .day-entries-title small { color: var(--faint); font-weight: 500; font-size: 13px; margin-left: 8px; }
  .day-list { display: flex; flex-direction: column; gap: 12px; }
  .day-entry {
    display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
    width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface);
    border-radius: var(--radius); padding: 16px 18px; cursor: pointer; font-family: inherit;
    transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
  }
  .day-entry:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .day-entry-title { font-size: 16px; font-weight: 650; color: var(--fg); }
  .day-entry-excerpt { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .day-entry-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .day-empty {
    text-align: center; padding: 34px 20px; color: var(--muted);
    border: 1.5px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface);
  }
  .day-empty svg { width: 34px; height: 34px; color: var(--faint); margin-bottom: 8px; }
  .day-empty p { margin: 4px 0 16px; }
  .cal-nav-btn:focus-visible, .cal-today-btn:focus-visible, .cal-day:focus-visible,
  .day-entry:focus-visible, .day-entries-head .btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- Diary list ---------- */
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 240px; max-width: 460px;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 11px; padding: 10px 14px; transition: border-color .15s ease, box-shadow .15s ease;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { width: 17px; height: 17px; color: var(--faint); flex-shrink: 0; }
  .search input { border: none; outline: none; background: transparent; flex: 1; font-family: inherit; font-size: 14.5px; color: var(--fg); }
  .diary-layout { display: grid; grid-template-columns: 1fr 260px; gap: 22px; align-items: start; }
  .entry-list { display: flex; flex-direction: column; gap: 12px; }
  .entry-card {
    padding: 16px 18px; cursor: pointer;
    transition: box-shadow .16s ease, transform .16s ease, border-color .16s ease;
  }
  .entry-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--border-strong); }
  .entry-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .entry-title { font-size: 16px; font-weight: 650; margin: 0; }
  .entry-date { color: var(--faint); font-size: 13px; white-space: nowrap; }
  .entry-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .entry-top--untitled { align-items: center; }
  .entry-tags-inline { margin-top: 0; }
  .entry-excerpt { color: var(--muted); font-size: 14px; margin: 8px 0 0; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .stats { padding: 20px; position: sticky; top: 34px; }
  .stats h3 { margin: 0 0 16px; font-size: 15px; font-weight: 700; }
  .stat-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .k { color: var(--muted); }
  .stat-row .v { font-weight: 650; font-variant-numeric: tabular-nums; }
  .empty {
    text-align: center; padding: 60px 20px; color: var(--muted);
    border: 1.5px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface);
  }
  .empty svg { width: 42px; height: 42px; color: var(--faint); margin-bottom: 10px; }
  .empty p { margin: 4px 0 16px; }

  /* ---------- Editor ---------- */
  .editor-head { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .editor-head .spacer { flex: 1; }
  .editor-card { padding: 26px 28px; }
  .title-input {
    width: 100%; border: none; outline: none; background: transparent;
    font-family: var(--font-display); font-size: 28px; font-weight: 700;
    color: var(--fg); letter-spacing: -0.01em; padding: 4px 0 14px;
    border-bottom: 1px solid var(--border); margin-bottom: 18px;
  }
  .title-input::placeholder { color: var(--faint); }
  .title-off {
    display: flex; align-items: center; gap: 9px;
    font-family: var(--font-display); font-size: 28px; font-weight: 700;
    color: var(--faint); letter-spacing: -0.01em;
    padding: 4px 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 18px;
  }
  .title-off svg { width: 22px; height: 22px; color: var(--faint); flex: none; }
  .editor-meta { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .meta-chip { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 14px; }
  .meta-chip svg { width: 16px; height: 16px; color: var(--faint); }
  .title-toggle {
    display: inline-flex; align-items: center; gap: 8px;
    border: none; background: transparent; padding: 7px 8px; margin: -7px -8px;
    font-family: inherit; cursor: pointer; border-radius: 9px;
  }
  .title-toggle .tt-track {
    position: relative; width: 34px; height: 20px; border-radius: 999px;
    background: var(--border-strong); transition: background .16s ease; flex: none;
  }
  .title-toggle .tt-thumb {
    position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .title-toggle.on .tt-track { background: var(--accent); }
  .title-toggle.on .tt-thumb { transform: translateX(14px); }
  .title-toggle .tt-label { font-size: 14px; font-weight: 600; color: var(--muted); transition: color .15s ease; }
  .title-toggle.on .tt-label { color: var(--fg); }
  .title-toggle:hover .tt-label { color: var(--fg); }
  .title-toggle:hover .tt-thumb { box-shadow: var(--shadow-md); }
  .title-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tag-picker { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .tag-picker-label { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13.5px; font-weight: 600; }
  .tag-picker-label svg { width: 16px; height: 16px; color: var(--faint); }
  .tag-req {
    font-size: 11.5px; font-weight: 700; line-height: 1;
    color: var(--accent-strong); background: var(--accent-soft);
    border-radius: 999px; padding: 3px 8px; margin-left: 2px;
  }
  .tag-sel { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tag-sel-empty { color: var(--faint); font-size: 13.5px; }
  .tag-add-btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px dashed var(--border-strong); background: var(--surface);
    border-radius: 999px; padding: 7px 14px; font-family: inherit;
    font-size: 13.5px; font-weight: 600; color: var(--accent-strong); cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .tag-add-btn svg { width: 15px; height: 15px; }
  .tag-add-btn:hover { background: var(--accent-soft); border-color: transparent; }
  .tag-add-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tag-sel-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--accent-soft); color: var(--accent-strong);
    border-radius: 999px; padding: 6px 7px 6px 13px;
    font-size: 13.5px; font-weight: 600;
  }
  .tag-sel-chip .x {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    color: var(--accent-strong); background: transparent; border: none; padding: 0;
    transition: background .15s ease;
  }
  .tag-sel-chip .x:hover { background: var(--accent-soft-hover); }
  .tag-sel-chip .x svg { width: 13px; height: 13px; }
  .tag-sel-chip .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .modal-scroll { max-height: 320px; overflow-y: auto; margin: 0 -6px 16px; padding: 2px 6px; }
  .tag-modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tag-modal-option {
    display: flex; align-items: center; gap: 9px;
    border: 1px solid var(--border-strong); background: var(--surface);
    border-radius: 11px; padding: 10px 12px; font-family: inherit;
    font-size: 14px; font-weight: 500; color: var(--fg); cursor: pointer; text-align: left;

const WEEKDAYS = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

/* ================= State ================= */
const STORE_KEY = "shiguang-diary-v1";
const DEFAULT_SETTINGS = { theme: "light", fontSize: 16, autosave: true, reminders: false, showListExcerpt: true };
const DEFAULT_USER = { name: "拾光用户", avatar: "" };

let state = {
  diaries: SEED_DIARIES.map((d, i) => ({ id: i + 1, ...d })),
  tags: [...SEED_TAGS],
  settings: { ...DEFAULT_SETTINGS },
  user: { ...DEFAULT_USER },
  view: "home",
  editingId: null,
  tagFilter: null,
  search: "",
  activeTags: [], // editor selection
  hasTitle: true, // whether the editor shows a title field
  calAnchor: new Date(),
  calSelected: null,
  newDiaryDate: null,
  calPickerOpen: false,
  calPickerView: "month", // "month" | "year"
  calPickerYear: new Date().getFullYear(),
  calPickerDecade: Math.floor(new Date().getFullYear() / 12) * 12
};

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state.diaries = saved.diaries || state.diaries;
      state.tags = saved.tags || state.tags;
      state.settings = Object.assign({}, DEFAULT_SETTINGS, saved.settings);
      state.user = Object.assign({}, DEFAULT_USER, saved.user);
    }
  } catch (e) { /* ignore corrupted storage */ }
}
function persist() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      diaries: state.diaries, tags: state.tags, settings: state.settings, user: state.user
    }));
  } catch (e) { /* storage may be unavailable */ }
}

/* ================= Autosave (draft for new entries) ================= */
const DRAFT_KEY = STORE_KEY + "-draft";
function saveDraft() {
  if (!state.settings.autosave || state.editingId != null) return;
  const contentEl = $("#editorContent");
  if (!contentEl) return;
  const titleEl = $("#editorTitle");
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      title: titleEl ? titleEl.value : "",
      content: contentEl.value,
      tags: state.activeTags,
      hasTitle: state.hasTitle
    }));
  } catch (e) { /* ignore */ }
}
function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ }
}

/* ================= Helpers ================= */
const $ = (sel) => document.querySelector(sel);
const todayStr = () => {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
};
const toDateStr = (d) => {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
};
const weekdayOf = (dateStr) => WEEKDAYS[new Date(dateStr + "T00:00:00").getDay()];
const fmtDate = (dateStr) => `${dateStr} · ${weekdayOf(dateStr)}`;
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const countWords = (s) => (s || "").replace(/\s/g, "").length;

function tagCount(name) {
  return state.diaries.filter((d) => (d.tags || []).includes(name)).length;
}
function computeStats() {
  const total = state.diaries.length;
  const words = state.diaries.reduce((s, d) => s + countWords(d.content) + countWords(d.title), 0);
  const dates = state.diaries.map((d) => d.date).sort();
  const activeDays = new Set(dates).size;
  return {
    total, words, activeDays,
    earliest: dates[0] || "—",
    latest: dates[dates.length - 1] || "—"
  };
}
function greeting() {
  const h = new Date().getHours();
  if (h < 6) return "夜深了";
  if (h < 11) return "早上好";
  if (h < 14) return "中午好";
  if (h < 18) return "下午好";
  return "晚上好";
}
function excerpt(content, len = 40) {
  const clean = (content || "").replace(/\s+/g, " ").trim();
  return clean.length > len ? clean.slice(0, len) + "…" : clean;
}
function userAvatarChar() {
  const avatar = (state.user.avatar || "").trim().charAt(0);
  if (avatar) return avatar;
  return (state.user.name || "拾").trim().charAt(0) || "拾";
}

/* ================= Navigation ================= */
const NAV_ITEMS = [
  { id: "home", label: "首页", icon: "home" },
  { id: "diary", label: "日记", icon: "book" },
  { id: "tags", label: "标签", icon: "tag" },
  { id: "settings", label: "设置", icon: "settings" }
];

function renderNav() {
  const diaryCount = state.diaries.length;
  $("#nav").innerHTML = NAV_ITEMS.map((n) => `
    <button class="nav-item ${state.view === n.id ? "active" : ""}" data-view="${n.id}">
      ${ICONS[n.icon]}<span>${n.label}</span>
      ${n.id === "diary" ? `<span class="nav-badge">${diaryCount}</span>` : ""}
    </button>`).join("");
}

function showView(view) {
  state.view = view;
  state.tagFilter = view === "tags" ? null : state.tagFilter; // keep tag filter only on diary
  document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
  const target = $("#view-" + view);
  if (target) target.classList.add("active");
  renderNav();
  switch (view) {
    case "home": renderHome(); break;
    case "diary": renderDiary(); break;
    case "editor": renderEditor(); break;
    case "tags": renderTags(); break;
    case "settings": renderSettings(); break;
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ================= Home ================= */
function renderHome() {
  const el = $("#view-home");
  el.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">${greeting()}，${escapeHtml(state.user.name)}</h1>
        <p class="page-sub">今天是 ${fmtDate(todayStr())}，写点什么留下来吧。</p>
      </div>
    </div>

    <div class="hero-calendar" id="homeCalendar"></div>
    <div id="homeDayEntries"></div>
  `;
  renderCalendar();
}

/* ================= Home calendar ================= */
function renderCalendar() {
  const el = $("#homeCalendar");
  const listEl = $("#homeDayEntries");
  if (!el || !listEl) return;
  if (!state.calSelected) state.calSelected = todayStr();

  const y = state.calAnchor.getFullYear();
  const m = state.calAnchor.getMonth();
  const today = todayStr();

  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

  const byDate = {};
  state.diaries.forEach((d) => { (byDate[d.date] = byDate[d.date] || []).push(d); });

  const cells = [];
  for (let i = 0; i < totalCells; i++) {
    const date = new Date(y, m, i - startOffset + 1);
    const dateStr = toDateStr(date);
    cells.push({
      dateStr,
      day: date.getDate(),
      other: date.getMonth() !== m,
      today: dateStr === today,
      selected: dateStr === state.calSelected,
      count: (byDate[dateStr] || []).length
    });
  }

  const selectedEntries = (byDate[state.calSelected] || []).slice().sort((a, b) => b.date.localeCompare(a.date));

  const dayGridHtml = `<div class="cal-weekdays">${["一", "二", "三", "四", "五", "六", "日"].map((w) => `<span>${w}</span>`).join("")}</div>
      <div class="cal-days">
        ${cells.map((c) => `
          <button class="cal-day ${c.other ? "other" : ""} ${c.today ? "today" : ""} ${c.selected ? "selected" : ""}" onclick="calSelect('${c.dateStr}')" aria-label="${c.dateStr}">
            <span class="cal-day-num">${c.day}</span>
            ${c.count ? `<span class="cal-dot"></span>` : ""}
          </button>`).join("")}
      </div>`;

  const bodyHtml = state.calPickerOpen
    ? (state.calPickerView === "year" ? calYearPickerHtml() : calMonthPickerHtml())
    : dayGridHtml;

  el.innerHTML = `
    <div class="cal-main">
      <div class="cal-head">
        <button class="cal-month-toggle ${state.calPickerOpen ? "open" : ""}" onclick="calTogglePicker()" aria-expanded="${state.calPickerOpen}" aria-label="选择年份和月份">
          ${y} 年 ${m + 1} 月
          ${ICONS.chevDown}
        </button>
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="calShift(-1)" title="上一个月">${ICONS.chevLeft}</button>
          <button class="cal-today-btn" onclick="calGotoToday()">回到今天</button>
          <button class="cal-nav-btn" onclick="calShift(1)" title="下一个月">${ICONS.chevRight}</button>
        </div>
      </div>
      ${bodyHtml}
    </div>
  `;

  listEl.innerHTML = `
    <div class="day-entries-head">
      <h2 class="day-entries-title">${fmtDate(state.calSelected)}${selectedEntries.length ? `<small>${selectedEntries.length} 篇</small>` : ""}</h2>
      <button class="btn btn-soft btn-sm" onclick="newDiaryOn('${state.calSelected}')">${ICONS.plus} 写一篇</button>
    </div>
    ${selectedEntries.length ? `<div class="day-list">
      ${selectedEntries.map((d) => `
        <button class="day-entry" onclick="editDiary(${d.id})">
          ${d.title && d.title.trim() ? `<span class="day-entry-title">${escapeHtml(d.title)}</span>` : ""}
          ${state.settings.showListExcerpt ? `<span class="day-entry-excerpt">${escapeHtml(excerpt(d.content, 80))}</span>` : ""}
          <span class="day-entry-meta">${(d.tags || []).map((t) => `<span class="tag-pill">${escapeHtml(t)}</span>`).join("") || `<span class="faint">未加标签</span>`}</span>
        </button>`).join("")}
    </div>` : `<div class="day-empty">${ICONS.pen}<p>这一天还没有记录</p><button class="btn btn-soft" onclick="newDiaryOn('${state.calSelected}')">${ICONS.plus} 写一篇</button></div>`}
  `;
}
function calShift(delta) {
  state.calPickerOpen = false;
  const d = new Date(state.calAnchor);
  d.setDate(1);
  d.setMonth(d.getMonth() + delta);
  state.calAnchor = d;
  renderCalendar();
}
function calGotoToday() {
  state.calPickerOpen = false;
  state.calAnchor = new Date();
  state.calSelected = todayStr();
  renderCalendar();
}
function calTogglePicker() {
  const y = state.calAnchor.getFullYear();
  state.calPickerOpen = !state.calPickerOpen;
  if (state.calPickerOpen) {
    state.calPickerView = "month";
    state.calPickerYear = y;
    state.calPickerDecade = Math.floor(y / 12) * 12;
  }
  renderCalendar();
}
function calPickerToggleView() {
  state.calPickerView = state.calPickerView === "month" ? "year" : "month";
  renderCalendar();
}
function calPickerDecade(delta) {
  state.calPickerDecade += delta;
  renderCalendar();
}
function calPickerSelectYear(year) {
  state.calPickerYear = year;
  state.calPickerView = "month";
  renderCalendar();
}
function calPickerYearStep(delta) {
  state.calPickerYear += delta;
  state.calPickerDecade = Math.floor(state.calPickerYear / 12) * 12;
  renderCalendar();
}
function calPickerSelectMonth(m) {
  const d = new Date(state.calAnchor);
  d.setDate(1);
  d.setFullYear(state.calPickerYear);
  d.setMonth(m);
  state.calAnchor = d;
  state.calPickerOpen = false;
  renderCalendar();
}
function calYearPickerHtml() {
  const cur = state.calAnchor.getFullYear();
  const start = state.calPickerDecade;
  const years = Array.from({ length: 12 }, (_, i) => start + i);
  return `
    <div class="cal-picker">
      <div class="cal-picker-head">
        <button class="cal-picker-nav" onclick="calPickerDecade(-12)" title="上一个年代">${ICONS.chevLeft}</button>
        <button class="cal-picker-title" onclick="calPickerToggleView()" title="返回月份">${start} – ${start + 11}</button>
        <button class="cal-picker-nav" onclick="calPickerDecade(12)" title="下一个年代">${ICONS.chevRight}</button>
      </div>
      <div class="cal-picker-grid">
        ${years.map((yr) => `<button class="cal-picker-cell ${yr === cur ? "selected" : ""}" onclick="calPickerSelectYear(${yr})">${yr}</button>`).join("")}
      </div>
    </div>`;
}
function calMonthPickerHtml() {
  const year = state.calPickerYear;
  const curM = state.calAnchor.getMonth();
  const curY = state.calAnchor.getFullYear();
  const months = Array.from({ length: 12 }, (_, i) => i);
  return `
    <div class="cal-picker">
      <div class="cal-picker-head">
        <button class="cal-picker-nav" onclick="calPickerYearStep(-1)" title="上一年">${ICONS.chevLeft}</button>
        <button class="cal-picker-title" onclick="calPickerToggleView()" title="选择年份">${year} 年 ${ICONS.chevDown}</button>
        <button class="cal-picker-nav" onclick="calPickerYearStep(1)" title="下一年">${ICONS.chevRight}</button>
      </div>
      <div class="cal-picker-grid">
        ${months.map((mi) => {
          const selected = year === curY && mi === curM;
          return `<button class="cal-picker-cell ${selected ? "selected" : ""}" onclick="calPickerSelectMonth(${mi})">${mi + 1} 月</button>`;
        }).join("")}
      </div>
    </div>`;
}
function calSelect(dateStr) {
  state.calSelected = dateStr;
  renderCalendar();
}
function newDiaryOn(dateStr) {
  newDiary(dateStr);
}

/* ================= Diary list ================= */

  const el = $("#view-diary");
  const q = state.search.trim().toLowerCase();
  let list = [...state.diaries].sort((a, b) => b.date.localeCompare(a.date));
  if (state.tagFilter) list = list.filter((d) => (d.tags || []).includes(state.tagFilter));
  if (q) {
    list = list.filter((d) => d.title.toLowerCase().includes(q) || (d.content || "").toLowerCase().includes(q) || (d.tags || []).join(" ").toLowerCase().includes(q));
  }
  const stats = computeStats();

  el.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">日记</h1>
        <p class="page-sub">${state.tagFilter ? `标签「${escapeHtml(state.tagFilter)}」下的 ${list.length} 篇` : `共 ${state.diaries.length} 篇记录`}</p>
      </div>
      <button class="btn btn-primary" onclick="newDiary()">${ICONS.plus} 新建日记</button>
    </div>

    <div class="toolbar">
      <div class="search">
        ${ICONS.search}
        <input type="text" id="searchInput" placeholder="搜索标题、内容或标签…" value="${escapeHtml(state.search)}" oninput="onSearch(this.value)">
      </div>
      ${state.tagFilter ? `<button class="btn btn-ghost btn-sm" onclick="clearTagFilter()">清除筛选「${escapeHtml(state.tagFilter)}」×</button>` : ""}
    </div>

    <div class="diary-layout">
      <div>
        ${list.length ? `<div class="entry-list">
          ${list.map((d) => `
            <div class="card entry-card" onclick="editDiary(${d.id})">
              <div class="entry-top${d.title && d.title.trim() ? "" : " entry-top--untitled"}">
                ${d.title && d.title.trim() ? `<h3 class="entry-title">${escapeHtml(d.title)}</h3>` : `<div class="entry-tags entry-tags-inline">${(d.tags || []).map((t) => `<span class="tag-pill" onclick="event.stopPropagation();filterByTag('${escapeHtml(t)}')">${escapeHtml(t)}</span>`).join("")}</div>`}
                <span class="entry-date">${fmtDate(d.date)}</span>
              </div>
              ${state.settings.showListExcerpt ? `<div class="entry-excerpt">${escapeHtml(excerpt(d.content, 60))}</div>` : ""}
              ${d.title && d.title.trim() ? `<div class="entry-tags">${(d.tags || []).map((t) => `<span class="tag-pill" onclick="event.stopPropagation();filterByTag('${escapeHtml(t)}')">${escapeHtml(t)}</span>`).join("")}</div>` : ""}
            </div>`).join("")}
        </div>` : `<div class="empty">${ICONS.search}<p>没有找到匹配的日记</p><button class="btn btn-ghost" onclick="clearFilters()">清除筛选</button></div>`}
      </div>

      <div class="card stats">
        <h3>统计</h3>
        <div class="stat-row"><span class="k">日记数</span><span class="v">${stats.total}</span></div>
        <div class="stat-row"><span class="k">总字数</span><span class="v">${stats.words}</span></div>
        <div class="stat-row"><span class="k">活跃天数</span><span class="v">${stats.activeDays}</span></div>
        <div class="stat-row"><span class="k">最早日期</span><span class="v" style="font-size:13px">${stats.earliest}</span></div>
        <div class="stat-row"><span class="k">最后日期</span><span class="v" style="font-size:13px">${stats.latest}</span></div>
      </div>
    </div>
  `;
}

/* ================= Editor ================= */
function newDiary(dateStr) {
  state.editingId = null;
  state.newDiaryDate = dateStr || null;
  const draft = state.settings.autosave ? loadDraft() : null;
  state.activeTags = draft && draft.tags ? [...draft.tags] : [];
  state.hasTitle = draft && typeof draft.hasTitle === "boolean" ? draft.hasTitle : true;
  showView("editor");
}
function editDiary(id) {
  state.editingId = id;
  const d = state.diaries.find((x) => x.id === id);
  state.activeTags = d ? [...(d.tags || [])] : [];
  state.hasTitle = !!(d && d.title && d.title.trim());
  showView("editor");
}

function renderEditor() {
  const el = $("#view-editor");
  const isNew = state.editingId == null;
  const d = isNew ? null : state.diaries.find((x) => x.id === state.editingId);
  const draft = isNew && state.settings.autosave ? loadDraft() : null;
  const titleVal = state.hasTitle ? (isNew ? (draft ? draft.title : "") : d.title) : "";
  const contentVal = isNew ? (draft ? draft.content : "") : d.content;

  const titleField = state.hasTitle
    ? `<input class="title-input" id="editorTitle" type="text" placeholder="给今天起个标题…" value="${escapeHtml(titleVal)}" maxlength="60">`
    : `<input class="title-input" id="editorTitle" type="text" placeholder="给今天起个标题…" value="" maxlength="60" style="display:none">
       <div class="title-off" id="titleOff">${ICONS.heading} 标题已关闭</div>`;

  el.innerHTML = `
    <div class="editor-head">
      <button class="btn btn-icon btn-ghost" onclick="backFromEditor()" title="返回">${ICONS.back}</button>
      <div class="spacer"></div>
      ${!isNew ? `<button class="btn btn-danger-ghost" onclick="deleteDiary(${d.id})">${ICONS.trash} 删除</button>` : ""}
      <button class="btn btn-primary" onclick="saveDiary()">保存日记</button>
    </div>

    <div class="card editor-card">
      ${titleField}

      <div class="editor-meta">
        <span class="meta-chip">${ICONS.calendar} ${fmtDate(isNew ? (state.newDiaryDate || todayStr()) : d.date)}</span>
        <button type="button" class="title-toggle${state.hasTitle ? " on" : ""}" id="titleToggle" role="switch" aria-checked="${state.hasTitle}" onclick="toggleTitle()">
          <span class="tt-track"><span class="tt-thumb"></span></span>
          <span class="tt-label">标题</span>
        </button>
      </div>

      <div class="tag-picker">
        <span class="tag-picker-label">${ICONS.tag} 标签${state.hasTitle ? "" : `<span class="tag-req">必选</span>`}</span>
        <div class="tag-sel" id="tagSel"></div>
      </div>

      <textarea class="content-area" id="editorContent" placeholder="日记内容编写...">${escapeHtml(contentVal)}</textarea>

      <div class="editor-foot">
        <span class="word-count" id="wordCount"></span>
        <span class="word-count" id="autosaveState">${isNew ? (state.settings.autosave ? "自动保存草稿中…" : "新建日记") : "编辑 · " + d.date}</span>
      </div>
    </div>
  `;

  renderTagPicker();

  const titleEl = $("#editorTitle");
  const content = $("#editorContent");
  const updateCount = () => { $("#wordCount").textContent = `${countWords(content.value)} 字`; };
  let autosaveTimer = null;
  const scheduleAutosave = () => {
    if (!isNew || !state.settings.autosave) return;
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => {
      saveDraft();
      const s = $("#autosaveState");
      if (s) s.textContent = "已自动保存 " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }, 600);
  };
  content.addEventListener("input", () => { updateCount(); scheduleAutosave(); });
  if (titleEl) titleEl.addEventListener("input", scheduleAutosave);
  updateCount();
  if (isNew) { if (titleEl) titleEl.focus(); else content.focus(); }
}

function renderTagPicker() {
  const wrap = $("#tagSel");
  if (!wrap) return;
  const selected = state.activeTags;
  const chips = selected.map((t) => `
    <span class="tag-sel-chip">${escapeHtml(t)}
      <button type="button" class="x" title="移除" aria-label="移除 ${escapeHtml(t)}" onclick="toggleTag('${escapeHtml(t)}')">${ICONS.x}</button>
    </span>`).join("");
  const addBtn = `<button type="button" class="tag-add-btn" onclick="openTagModal()">${ICONS.plus} 添加标签</button>`;
  wrap.innerHTML = (chips ? chips : `<span class="tag-sel-empty">还未添加标签</span>`) + addBtn;
}
function toggleTag(tag) {
  const i = state.activeTags.indexOf(tag);
  if (i >= 0) state.activeTags.splice(i, 1);
  else state.activeTags.push(tag);
  renderTagPicker();
  renderTagModalOptions();
  if (state.editingId == null) saveDraft();
}
function toggleTitle() {
  state.hasTitle = !state.hasTitle;
  const titleEl = $("#editorTitle");
  const off = $("#titleOff");
  const toggle = $("#titleToggle");
  if (titleEl) {
    titleEl.style.display = state.hasTitle ? "" : "none";
    if (!state.hasTitle) titleEl.value = "";
  }
  if (off) off.style.display = state.hasTitle ? "none" : "";
  if (toggle) {
    toggle.classList.toggle("on", state.hasTitle);
    toggle.setAttribute("aria-checked", String(state.hasTitle));
  }
  const label = document.querySelector("#view-editor .tag-picker-label");
  if (label) {
    const req = label.querySelector(".tag-req");
    if (!state.hasTitle && !req) label.insertAdjacentHTML("beforeend", `<span class="tag-req">必选</span>`);
    else if (state.hasTitle && req) req.remove();
  }
  if (state.editingId == null) saveDraft();
  if (state.hasTitle && titleEl) titleEl.focus();
}
function openTagModal() {
  const root = $("#modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width: 460px;">
        <h3>选择标签</h3>

}
function renderTagModalOptions() {
  const body = $("#tagModalBody");
  if (!body) return;
  const input = $("#tagSearchInput");
  const raw = input ? input.value.trim() : "";
  const q = raw.toLowerCase();
  if (!state.tags.length) {
    body.innerHTML = `<div class="tag-modal-empty"><p>还没有标签</p><button class="btn btn-soft" onclick="addTagFromModal()">${ICONS.plus} 新建标签</button></div>`;
    return;
  }
  const filtered = q ? state.tags.filter((t) => t.toLowerCase().includes(q)) : state.tags;
  if (!filtered.length) {
    body.innerHTML = `<div class="tag-modal-empty"><p>没有找到与「${escapeHtml(raw)}」匹配的标签</p><button class="btn btn-soft" onclick="addTagFromModal()">${ICONS.plus} 新建标签「${escapeHtml(raw)}」</button></div>`;
    return;
  }
  body.innerHTML = `<div class="tag-modal-grid">${filtered.map((t) => {
    const on = state.activeTags.includes(t);
    return `<button type="button" class="tag-modal-option${on ? " on" : ""}" aria-pressed="${on}" onclick="toggleTag('${escapeHtml(t)}')"><span class="mark">${on ? ICONS.check : ""}</span><span class="n">${escapeHtml(t)}</span><span class="cnt">${tagCount(t)} 篇</span></button>`;

function addTagFromModal() {
  const preset = (($("#tagSearchInput")?.value) || "").trim();
  openModal({
    title: "新建标签",
    body: "输入一个新标签名，用于归类日记。",

      state.tags.push(name);

function saveDiary() {
  const titleEl = $("#editorTitle");
  const title = state.hasTitle && titleEl ? titleEl.value.trim() : "";
  const content = $("#editorContent").value.trim();
  if (state.hasTitle && !title) { toast("请先写一个标题，或关闭标题栏", "danger"); if (titleEl) titleEl.focus(); return; }
  if (!state.hasTitle && !state.activeTags.length) { toast("关闭标题后请至少选择一个标签", "danger"); openTagModal(); return; }

  if (state.editingId == null) {
    const id = Math.max(0, ...state.diaries.map((d) => d.id)) + 1;
    state.diaries.push({ id, title, content, date: state.newDiaryDate || todayStr(), tags: [...state.activeTags] });
    toast("日记已保存", "success");
  } else {
    const d = state.diaries.find((x) => x.id === state.editingId);
    if (d) { d.title = title; d.content = content; d.tags = [...state.activeTags]; }
    toast("修改已保存", "success");
  }
  state.newDiaryDate = null;
  persist();
  clearDraft();
  showView("diary");
}

function deleteDiary(id) {
  const d = state.diaries.find((x) => x.id === id);
  if (!d) return;
  openModal({
    title: "删除这篇日记？",

      persist();
      toast("日记已删除", "success");
      showView("diary");
    }
  });
}

    input: true,
    onConfirm: (value) => {
      const name = value.trim();
      if (!name) { toast("标签名不能为空", "danger"); return false; }
      if (state.tags.includes(name)) { toast("这个标签已存在", "danger"); return false; }

function renameTag(oldName) {
  openModal({
    title: "重命名标签",
    body: `把标签「${oldName}」改成新名称，所有引用它的日记会一并更新。`,
    confirmText: "保存",
    input: true,
    onConfirm: (value) => {
      const name = value.trim();
      if (!name) { toast("标签名不能为空", "danger"); return false; }
      if (name === oldName) return true;
      if (state.tags.includes(name)) { toast("这个标签已存在", "danger"); return false; }
      const idx = state.tags.indexOf(oldName);
      if (idx > -1) state.tags[idx] = name;
      state.diaries.forEach((d) => {
        if ((d.tags || []).includes(oldName)) {
          d.tags = d.tags.map((t) => (t === oldName ? name : t));
        }
      });
      if (state.activeTags.includes(oldName)) {
        state.activeTags = state.activeTags.map((t) => (t === oldName ? name : t));
      }
      persist();
      toast(`标签已重命名为「${name}」`, "success");
      renderTags();
      return true;
    }
  });
  const input = $("#modalInput");
  if (input) { input.value = oldName; input.setSelectionRange(oldName.length, oldName.length); }
}

function deleteTag(name) {
  openModal({
    title: "删除标签",
    body: `确定删除标签「${name}」吗？该标签会从所有日记中移除，但日记本身不会被删除。`,
    confirmText: "删除",
    danger: true,
    onConfirm: () => {
      state.tags = state.tags.filter((t) => t !== name);
      state.diaries.forEach((d) => {
        if (d.tags) d.tags = d.tags.filter((t) => t !== name);
      });
      state.activeTags = state.activeTags.filter((t) => t !== name);
      persist();
      toast(`标签「${name}」已删除`, "success");
      renderTags();
      return true;
    }
  });
}

/* ================= Config directory (persisted via IndexedDB) ================= */
const CONFIG_DIR_DB = "shiguang-config-dir";
const CONFIG_DIR_STORE = "dir";
let configDirHandle = null;
let configDirName = "";

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(CONFIG_DIR_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(CONFIG_DIR_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function restoreConfigDir() {
  if (!window.indexedDB) return;
  try {
    const db = await idbOpen();
    const get = db.transaction(CONFIG_DIR_STORE, "readonly").objectStore(CONFIG_DIR_STORE).get("dir");
    const saved = await new Promise((res) => { get.onsuccess = () => res(get.result); get.onerror = () => res(null); });
    if (saved && saved.handle) {
      configDirHandle = saved.handle;
      configDirName = saved.name || (configDirHandle.name || "");
    }
    db.close();
  } catch (e) { /* ignore */ }
}
async function persistConfigDir() {
  if (!window.indexedDB) return;
  try {
    const db = await idbOpen();
    const tx = db.transaction(CONFIG_DIR_STORE, "readwrite");
    tx.objectStore(CONFIG_DIR_STORE).put({ handle: configDirHandle, name: configDirName }, "dir");
    db.close();
  } catch (e) { /* ignore */ }
}
async function chooseConfigDir() {
  if (!window.showDirectoryPicker) {
    toast("当前浏览器不支持选择固定文件夹，将使用默认下载位置", "");
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode: "readwrite" });
    configDirHandle = handle;
    configDirName = handle.name || "";
    persistConfigDir();
    updateConfigDirLabel();
    toast("保存位置已设为「" + configDirName + "」", "success");
  } catch (e) {
    if (e && e.name === "AbortError") return; // 用户取消
  }
}
async function clearConfigDir() {
  configDirHandle = null;
  configDirName = "";
  persistConfigDir();
  updateConfigDirLabel();
  toast("已恢复为默认保存位置", "success");
}
function updateConfigDirLabel() {
  const el = $("#config-path-label");
  if (el) el.textContent = configDirName ? ("固定文件夹：" + configDirName) : "未设置（保存时询问或下载到默认目录）";
  const actions = $("#config-dir-actions");
  if (actions) actions.innerHTML = `
    ${configDirName ? `<button class="btn-link" onclick="clearConfigDir()">恢复默认</button>` : ""}
    <button class="btn btn-ghost" onclick="chooseConfigDir()">${ICONS.folder} ${configDirName ? "更改" : "选择文件夹"}</button>`;
}

async function saveConfig() {
  const config = {
    _comment: "拾光日记 · 配置文件（diary_config.json）",
    savedAt: new Date().toISOString(),
    settings: state.settings
  };
  const json = JSON.stringify(config, null, 2);
  const filename = "diary_config.json";

  // 已配置固定文件夹时，直接写入该文件夹
  if (configDirHandle) {
    try {
      const fileHandle = await configDirHandle.getFileHandle(filename, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(json);
      await writable.close();
      toast("配置已保存到「" + configDirName + "」", "success");
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
      // 写入失败回退到另存为 / 下载
    }
  }

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: "JSON 配置文件", accept: { "application/json": [".json"] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      toast("配置已保存到 " + (handle.name || filename), "success");
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return; // 用户取消
      // 其它错误回退到下载
    }
  }

  downloadBlob(new Blob([json], { type: "application/json" }), filename);
  toast("配置已保存为 " + filename, "success");
}
function importConfig() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const s = data.settings || data;
        if (typeof s !== "object" || s === null) throw new Error();
        state.settings = Object.assign({}, DEFAULT_SETTINGS, s);
        persist();
        applyTheme();
        document.documentElement.style.fontSize = state.settings.fontSize + "px";
        renderSettings();
        toast("配置已导入", "success");
      } catch (e) {
        toast("配置导入失败：文件格式不正确", "danger");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

    onConfirm: () => {

      persist();
      clearDraft();
      toast("所有数据已清空", "success");
      showView("home");
    }
  });
}

/* ================= Modal ================= */
function openModal(opts) {
  const root = $("#modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${escapeHtml(opts.title)}</h3>
        <p>${escapeHtml(opts.body)}</p>
        ${opts.input ? `<input type="text" id="modalInput" placeholder="标签名" maxlength="20" onkeydown="if(event.key==='Enter')confirmModal()">` : ""}
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">取消</button>
          <button class="btn ${opts.danger ? "btn-danger" : "btn-primary"}" id="modalConfirm" onclick="confirmModal()">${escapeHtml(opts.confirmText || "确定")}</button>
        </div>
      </div>
    </div>`;
  if (opts.input) {
    root.querySelector("#modalInput").focus();
  }
  root._confirm = opts.onConfirm;
  root._input = opts.input;
}
function closeModal() { $("#modalRoot").innerHTML = ""; }
function confirmModal() {
  const root = $("#modalRoot");
  const fn = root._confirm;
  if (!fn) { closeModal(); return; }
  let result = true;
  if (root._input) {
    const val = root.querySelector("#modalInput").value;
    result = fn(val);
  } else {
    result = fn();
  }
  if (result !== false) closeModal();
}

/* ================= Toast ================= */
function toast(msg, type = "") {
  const wrap = $("#toastWrap");
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s ease"; setTimeout(() => el.remove(), 300); }, 2400);
}

/* ================= Search / filter ================= */
function onSearch(v) {
  state.search = v;
  renderDiary();
  // keep focus
  const inp = $("#searchInput");
  const len = v.length;
  if (inp) { inp.focus(); inp.setSelectionRange(len, len); }
}
function filterByTag(tag) {
  state.tagFilter = tag;
  state.search = "";
  showView("diary");
}
function clearTagFilter() {
  state.tagFilter = null;
  renderDiary();
}
function clearFilters() {
  state.search = "";
  state.tagFilter = null;
  renderDiary();
}

/* ================= Events ================= */
document.addEventListener("click", (e) => {
  const nav = e.target.closest(".nav-item[data-view]");
  if (nav) showView(nav.dataset.view);
});

/* ================= Init ================= */
function init() {
  load();
  restoreConfigDir();
  applyTheme();
  applyUser();
  document.documentElement.style.fontSize = state.settings.fontSize + "px";
  renderNav();
  showView("home");
}
init();
</script>
