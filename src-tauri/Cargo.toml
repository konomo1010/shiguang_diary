[package]
name = "shiguang-diary"
version = "1.0.0"
description = "拾光日记"
authors = ["konomo1010"]
edition = "2021"

[lib]
name = "shiguang_diary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
